<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hackathons and Achievements</title>
  <desc id="desc">Three achievement cards: fifth place in India's Biggest Student Cloud Hackathon, second place in Glitch the System Hackathon, and qualifier in TCS CodeVita Round 1.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="55%" stop-color="#151522"/>
      <stop offset="100%" stop-color="#0d0e17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CBA6F7"/>
      <stop offset="100%" stop-color="#8B6DC4"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#202031"/>
      <stop offset="100%" stop-color="#171724"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#8b6dc4" stroke-width="0.65" opacity="0.12"/>
      <path d="M0 0L38 38" fill="none" stroke="#8b6dc4" stroke-width="0.45" opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
      .title { font-size: 22px; font-weight: 700; fill: #f4f0fb; }
      .body { font-size: 16px; fill: #c8c4d5; }
      .muted { font-size: 14px; fill: #9692a8; }
      .rank { font-size: 18px; font-weight: 750; fill: #f8f4ff; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="618" rx="24" fill="url(#bg)" stroke="#4A3B69" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="616" rx="23" fill="url(#grid)"/>
  <circle cx="1120" cy="28" r="95" fill="#7655ad" opacity=".10" filter="url(#glow)"/>
  <circle cx="1120" cy="28" r="56" fill="none" stroke="#CBA6F7" opacity=".14"/>
  <g class="font">
    <rect x="38" y="32" width="188" height="30" rx="15" fill="#2b203b" stroke="#5d477f"/>
    <circle cx="54" cy="47" r="4" fill="#CBA6F7"/>
    <text x="67" y="52" class="eyebrow" fill="#CBA6F7">MILESTONES / 03</text>
    <text x="38" y="111" font-size="38" font-weight="750" fill="#ffffff">Hackathons &amp; Achievements</text>
    <rect x="38" y="130" width="82" height="4" rx="2" fill="url(#accent)"/>
    <text x="38" y="162" font-size="16" fill="#aaa4bc">Competitive programming, cloud architecture, and product building.</text>
  </g>

  <!-- Card 1 -->
  <g class="font">
    <rect x="37" y="198" width="360" height="374" rx="18" fill="#CBA6F7" opacity=".08" filter="url(#glow)"/>
    <rect x="37" y="198" width="360" height="374" rx="18" fill="url(#card)" stroke="#554071" stroke-width="1.3"/>
    <path d="M55 199H379" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <rect x="59" y="221" width="88" height="27" rx="13.5" fill="#2d2340" stroke="#6c5293"/>
    <text x="103" y="239" text-anchor="middle" class="tag" fill="#CBA6F7">HACKATHON</text>
    <circle cx="91" cy="293" r="27" fill="#352745" stroke="#8b6dc4" stroke-width="1.2"/>
    <text x="91" y="301" text-anchor="middle" font-size="26">🏅</text>
    <text x="130" y="290" class="rank">5th Place</text>
    <text x="130" y="312" class="muted">1.5K+ developers</text>
    <text x="59" y="363" class="title">India's Biggest Student</text>
    <text x="59" y="391" class="title">Cloud Hackathon</text>
    <path d="M59 416H375" stroke="#4a3b69" stroke-width="1"/>
    <text x="59" y="448" class="eyebrow" fill="#CBA6F7">HIGHLIGHT</text>
    <text x="59" y="478" class="body">Cloud architecture and</text>
    <text x="59" y="502" class="body">deployment.</text>
    <rect x="59" y="530" width="128" height="23" rx="11.5" fill="#2b203b"/>
    <text x="123" y="545" text-anchor="middle" class="tag" fill="#d8c2f5">CLOUD / DEPLOYMENT</text>
  </g>

  <!-- Card 2 -->
  <g class="font">
    <rect x="420" y="198" width="360" height="374" rx="18" fill="#CBA6F7" opacity=".08" filter="url(#glow)"/>
    <rect x="420" y="198" width="360" height="374" rx="18" fill="url(#card)" stroke="#554071" stroke-width="1.3"/>
    <path d="M438 199H762" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <rect x="442" y="221" width="88" height="27" rx="13.5" fill="#2d2340" stroke="#6c5293"/>
    <text x="486" y="239" text-anchor="middle" class="tag" fill="#CBA6F7">HACKATHON</text>
    <circle cx="474" cy="293" r="27" fill="#352745" stroke="#8b6dc4" stroke-width="1.2"/>
    <text x="474" y="301" text-anchor="middle" font-size="26">🥈</text>
    <text x="513" y="290" class="rank">2nd Place</text>
    <text x="513" y="312" class="muted">Product build</text>
    <text x="442" y="363" class="title">Glitch the System</text>
    <text x="442" y="391" class="title">Hackathon</text>
    <path d="M442 416H758" stroke="#4a3b69" stroke-width="1"/>
    <text x="442" y="448" class="eyebrow" fill="#CBA6F7">HIGHLIGHT</text>
    <text x="442" y="478" class="body">Programmed a functional</text>
    <text x="442" y="502" class="body">rebadging website on Replit.</text>
    <rect x="442" y="530" width="117" height="23" rx="11.5" fill="#2b203b"/>
    <text x="500" y="545" text-anchor="middle" class="tag" fill="#d8c2f5">WEB DEVELOPMENT</text>
  </g>

  <!-- Card 3 -->
  <g class="font">
    <rect x="803" y="198" width="360" height="374" rx="18" fill="#CBA6F7" opacity=".08" filter="url(#glow)"/>
    <rect x="803" y="198" width="360" height="374" rx="18" fill="url(#card)" stroke="#554071" stroke-width="1.3"/>
    <path d="M821 199H1145" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <rect x="825" y="221" width="88" height="27" rx="13.5" fill="#2d2340" stroke="#6c5293"/>
    <text x="869" y="239" text-anchor="middle" class="tag" fill="#CBA6F7">CONTEST</text>
    <circle cx="857" cy="293" r="27" fill="#352745" stroke="#8b6dc4" stroke-width="1.2"/>
    <text x="857" y="301" text-anchor="middle" font-size="25">✅</text>
    <text x="896" y="290" class="rank">Qualifier</text>
    <text x="896" y="312" class="muted">Round 1</text>
    <text x="825" y="363" class="title">TCS CodeVita</text>
    <text x="825" y="391" class="title">Round 1</text>
    <path d="M825 416H1141" stroke="#4a3b69" stroke-width="1"/>
    <text x="825" y="448" class="eyebrow" fill="#CBA6F7">HIGHLIGHT</text>
    <text x="825" y="478" class="body">Global competitive</text>
    <text x="825" y="502" class="body">programming contest.</text>
    <rect x="825" y="530" width="145" height="23" rx="11.5" fill="#2b203b"/>
    <text x="897" y="545" text-anchor="middle" class="tag" fill="#d8c2f5">PROBLEM SOLVING</text>
  </g>
</svg>
